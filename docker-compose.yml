services:
  send-to-scribe:
    build: .
    container_name: send-to-scribe
    restart: unless-stopped
    env_file: .env # OWNER_LOGIN, never committed
    volumes:
      - send-to-scribe-data:/data
    # Localhost only. Published to your tailnet with: tailscale serve --bg --https=7443 http://127.0.0.1:8790
    ports:
      - "127.0.0.1:8790:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s

volumes:
  send-to-scribe-data:
