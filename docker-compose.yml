services:
  send-to-scribe:
    build: .
    container_name: send-to-scribe
    restart: unless-stopped
    environment:
      TLS_CERT: /certs/scribe.upliftedconsulting.com.crt
      TLS_KEY: /certs/scribe.upliftedconsulting.com.key
    volumes:
      - send-to-scribe-data:/data
      - ${HOME}/.local/share/lego/certificates:/certs:ro # renewed by renew-cert.sh
    # Localhost only. Your tailnet reaches it via: tailscale serve --bg --tcp=443 tcp://127.0.0.1:8790
    ports:
      - "127.0.0.1:8790:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('https://localhost:3000/healthz', { tls: { rejectUnauthorized: false } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s

volumes:
  send-to-scribe-data:
